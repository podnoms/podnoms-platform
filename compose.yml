services:
  app:
    image: ${PODNOMS_IMAGE:-ghcr.io/podnoms/podnoms-platform:latest}
    build: .
    init: true
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://podnoms:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD for bundled Postgres, or DATABASE_URL for external Postgres}@postgres:5432/podnoms}
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET to at least 32 characters}
      SITE_URL: ${SITE_URL:-http://localhost:${PORT:-3000}}
      MEDIA_DIR: /app/media
      AUTH_GITHUB_ID: ${AUTH_GITHUB_ID:-}
      AUTH_GITHUB_SECRET: ${AUTH_GITHUB_SECRET:-}
      AUTH_GOOGLE_ID: ${AUTH_GOOGLE_ID:-}
      AUTH_GOOGLE_SECRET: ${AUTH_GOOGLE_SECRET:-}
      AUTH_FACEBOOK_ID: ${AUTH_FACEBOOK_ID:-}
      AUTH_FACEBOOK_SECRET: ${AUTH_FACEBOOK_SECRET:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # A Sentry-compatible DSN (e.g. GlitchTip) for server and browser errors.
      SENTRY_DSN: ${SENTRY_DSN:-}
      # Redis for background jobs. Set to redis://redis:6379 with the bundled
      # Redis (the redis profile), or to your own; empty, scheduled jobs don't run.
      REDIS_URL: ${REDIS_URL:-}
      # Optional Pexels API key for the "Random image" button on artwork;
      # without it, photos come from Openverse, which needs no key.
      PEXELS_API_KEY: ${PEXELS_API_KEY:-}
      # Custom domains (see README.md): where owners point their CNAME, the
      # edge container's name, and a token Traefik sends for /api/traefik/config.
      CUSTOM_DOMAIN_TARGET: ${CUSTOM_DOMAIN_TARGET:-}
      CUSTOM_DOMAIN_EDGE_HOST: ${CUSTOM_DOMAIN_EDGE_HOST:-}
      TRAEFIK_CONFIG_TOKEN: ${TRAEFIK_CONFIG_TOKEN:-}
    volumes:
      - media:/app/media
    # Picked up by Grafana Alloy (see deploy/observability). Docker keeps a
    # rotated copy of the logs too.
    labels:
      logging: alloy
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    depends_on:
      postgres:
        condition: service_healthy
        required: false
      redis:
        condition: service_healthy
        required: false

  postgres:
    image: postgres:17-bookworm
    profiles: [postgres]
    restart: unless-stopped
    environment:
      POSTGRES_USER: podnoms
      POSTGRES_DB: podnoms
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  redis:
    image: redis:8-alpine
    profiles: [redis]
    restart: unless-stopped
    # Jobs are kept on disk, so queued and scheduled jobs survive a restart.
    command: redis-server --appendonly yes
    volumes:
      - redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

  # Certificates for podcasts' custom domains; Traefik passes those domains'
  # connections through to it (see "Custom domains" in README.md). It must
  # share a network with Traefik, and the app needs CUSTOM_DOMAIN_EDGE_HOST
  # set to its name (podnoms-edge).
  podnoms-edge:
    image: caddy:2
    profiles: [custom-domains]
    restart: unless-stopped
    environment:
      ACME_EMAIL: ${ACME_EMAIL:-}
      APP_HOST: app:3000
    volumes:
      - ./docker/edge/Caddyfile:/etc/caddy/Caddyfile:ro
      - edge-data:/data
      - edge-config:/config

volumes:
  media:
  postgres:
  redis:
  edge-data:
  edge-config:
